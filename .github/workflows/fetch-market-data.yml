name: Fetch market data

on:
  schedule:
    # GitHub cron times are UTC, Monday-Friday.
    # 10:15 UTC = 6:15 AM Toronto in summer (EDT) / 5:15 AM in winter (EST)
    # 11:15 UTC = 7:15 AM Toronto in summer (EDT) / 6:15 AM in winter (EST)
    # Two runs keep a fresh pull before the 7:07 AM dashboard refresh all year.
    # GitHub can start scheduled runs 10-20 minutes late at busy times.
    - cron: "15 10 * * 1-5"
    - cron: "15 11 * * 1-5"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push: # also runs whenever the script or this file changes
    branches: [main]
    paths:
      - fetch.py
      - requirements.txt
      - .github/workflows/fetch-market-data.yml

permissions:
  contents: write # lets the job commit the data/ folder back to the repo

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Pull data from Yahoo Finance and FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # stored in repo Settings > Secrets, never in code
        run: python fetch.py

      - name: Save data to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Market data $(TZ=America/Toronto date '+%Y-%m-%d %H:%M %Z')"
          git pull --rebase origin main
          git push origin HEAD:main
